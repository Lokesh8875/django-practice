{% extends 'base.html' %}
{% block content %}
<form method='post'>
  {% csrf_token %}
  {{ form.as_p }}
  <button>Add</button>
</form>
<ul>
  {% for t in tasks %}
  <li>
    <span class='{% if t.done %}done{% endif %}'>{{ t.title }}</span>
    <form class='inline' method='post' action='{% url 'toggle_task' t.pk %}'>
      {% csrf_token %}<button>{% if t.done %}Undo{% else %}Done{% endif %}</button>
    </form>
    <form class='inline' method='post' action='{% url 'delete_task' t.pk %}'>
      {% csrf_token %}<button>Delete</button>
    </form>
  </li>
  {% empty %}
  <li>No tasks yet.</li>
  {% endfor %}
</ul>
{% endblock %}
